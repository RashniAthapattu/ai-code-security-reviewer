# Template only. Do NOT put a real key in this file.
#
# Create the real Secret from your terminal instead:
#   kubectl create secret generic backend-secret \
#     --namespace security-reviewer \
#     --from-literal=ANTHROPIC_API_KEY=your-key-here
#
# Without it the app still works as a plain scanner (no AI explanations).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: security-reviewer
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
