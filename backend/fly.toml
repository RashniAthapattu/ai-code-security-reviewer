# Fly.io setup for the API. Deploy from this folder: fly deploy
# The app name must be unique on Fly, so change it if it is already taken.
app = "ai-code-security-reviewer-api"
primary_region = "arn" # Stockholm

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # A cheaper model keeps the demo's cost low.
  ANTHROPIC_MODEL = "claude-haiku-5-5"
  # Secrets (ANTHROPIC_API_KEY, ALLOWED_ORIGINS) are set with `fly secrets set`,
  # never in this file.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"  # sleeps when idle, to save money
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  # Semgrep needs more than the smallest 256 MB machine.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
